version: '3.8'

services:
  main:
    build:
      context: ./main-app
      dockerfile: Dockerfile
    container_name: gramwon-main
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production

  password:
    build:
      context: ./password-app
      dockerfile: Dockerfile
    container_name: gramwon-password
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - AUTH_ID=${AUTH_ID}
      - AUTH_PASSWORD=${AUTH_PASSWORD}
      - SESSION_SECRET=${SESSION_SECRET}
      - GOOGLE_SHEET_ID=${GOOGLE_SHEET_ID}
      - NODE_ENV=production
    env_file:
      - ./password-app/.env
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
